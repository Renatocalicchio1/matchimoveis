name: Backup PostgreSQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Fazer dump do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M)
          CLEAN_URL=$(echo -n "$DATABASE_URL" | tr -d '\n\r ')
          /usr/lib/postgresql/18/bin/pg_dump "$CLEAN_URL" --no-password -F p | gzip > backups/backup-$TIMESTAMP.sql.gz
          echo "Backup criado: backup-$TIMESTAMP.sql.gz"
          ls -lh backups/

      - name: Manter só últimos 48 backups
        run: |
          cd backups
          ls -t *.sql.gz 2>/dev/null | tail -n +49 | xargs -r rm
          echo "Backups mantidos: $(ls *.sql.gz 2>/dev/null | wc -l)"

      - name: Commit e push do backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@matchimoveis.ia.br"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date '+%d/%m/%Y %H:%M')"
          git push
