name: Backup PostgreSQL
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install pg client
        run: sudo apt-get install -y postgresql-client
      - name: Fazer backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          FILENAME="backups/backup_$(date +%Y%m%d_%H%M%S).sql"
          pg_dump "$DATABASE_URL" > "$FILENAME"
          gzip "$FILENAME"
          ls -t backups/*.sql.gz | tail -n +4 | xargs -r rm
      - name: Commit backup
        run: |
          git config user.name "MatchBot"
          git config user.email "bot@matchimoveis.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date +%Y-%m-%d)"
          git push
