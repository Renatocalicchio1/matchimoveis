# Infraestrutura de e-mail marketing self-hosted — Listmonk (painel/engine
# de disparo) + Postgres (banco do Listmonk, separado do banco da
# plataforma MatchImóveis).
#
# ⚠️ Postfix/OpenDKIM NÃO sobem por aqui (containers `postfix`/`opendkim`
# comentados no fim do arquivo). Na VPS real (set/2026) os dois já rodam
# nativos via systemd, instalados por setup_email_infra.sh — subir os
# containers equivalentes brigaria pela porta 25 e pelo socket do milter
# com o que já está funcionando. Só sobe esse compose DEPOIS de já ter
# rodado setup_email_infra.sh (ver README.md).
#
# Rodar: docker compose up -d db listmonk

services:
  # Banco de dados do Listmonk — próprio, separado do banco da plataforma
  # MatchImóveis (não reaproveita o Postgres principal de propósito: uma
  # campanha de 118k gerando muita escrita não deve competir com o banco
  # de produção da plataforma).
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB: listmonk
    volumes:
      - listmonk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - listmonk_net

  # Listmonk — painel de gerenciamento de listas/campanhas + motor de
  # disparo. Config completa em config.toml (gerado no 1º boot, ou monta
  # um arquivo próprio em ./listmonk-config.toml se preferir versionar).
  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"   # painel web — considera colocar atrás de nginx+TLS antes de expor pra internet
    environment:
      LISTMONK_db__host: db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      # Sem isso o Listmonk escuta só em 127.0.0.1 DENTRO do container — o
      # port-mapping do Docker (0.0.0.0:9000->9000) não alcança, e toda
      # conexão de fora dá "connection reset" mesmo com a porta mapeada certa.
      LISTMONK_app__address: 0.0.0.0:9000
      # App aponta o webhook de bounce/unsubscribe pra plataforma MatchImóveis
      LISTMONK_app__root_url: ${LISTMONK_ROOT_URL}
    volumes:
      - listmonk_uploads:/listmonk/uploads
    networks:
      - listmonk_net

  # Postfix e OpenDKIM: DESATIVADOS neste compose (comentado de propósito).
  # Rodam nativos via systemd na VPS (setup_email_infra.sh) — confirmado
  # funcionando (DKIM/SPF/DMARC passando) em set/2026. Não descomentar sem
  # antes parar os serviços systemd (`systemctl stop postfix opendkim`),
  # senão os dois brigam pela porta 25 e pelo socket /var/run/opendkim.
  #
  # postfix:
  #   image: boky/postfix:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     ALLOWED_SENDER_DOMAINS: matchimoveis.online
  #     HOSTNAME: mail.matchimoveis.online
  #     RELAYHOST: ""
  #     OPENDKIM_ENABLED: "false"
  #   volumes:
  #     - ./postfix/main.cf:/etc/postfix/main.cf:ro
  #     - postfix_spool:/var/spool/postfix
  #     - /var/run/opendkim:/var/run/opendkim
  #   depends_on:
  #     - opendkim
  #
  # opendkim:
  #   image: agilestacks/opendkim:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./opendkim/opendkim.conf:/etc/opendkim.conf:ro
  #     - ./opendkim/KeyTable:/etc/opendkim/KeyTable:ro
  #     - ./opendkim/SigningTable:/etc/opendkim/SigningTable:ro
  #     - ./opendkim/TrustedHosts:/etc/opendkim/TrustedHosts:ro
  #     - /etc/opendkim/keys:/etc/opendkim/keys:ro
  #     - /var/run/opendkim:/var/run/opendkim

networks:
  listmonk_net:
    driver: bridge

volumes:
  listmonk_db_data:
  listmonk_uploads:
  postfix_spool:
