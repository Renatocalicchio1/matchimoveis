# /etc/opendkim.conf — assina cada e-mail de saída do Postfix com a chave
# DKIM privada, provando pra quem recebe que a mensagem realmente saiu do
# domínio matchimoveis.online e não foi falsificada no meio do caminho.

# Modo de operação: só ASSINA (não verifica assinatura de e-mail recebido —
# esse servidor não recebe e-mail de fora, só envia)
Mode s

# Domínio e seletor — "seletor" é o nome usado no registro DNS
# (match2026._domainkey.matchimoveis.online), pra poder trocar a chave no
# futuro sem quebrar a antiga (rotaciona o seletor, não o domínio)
Domain matchimoveis.online
Selector match2026

# Onde estão as chaves/tabelas (geradas por setup_email_infra.sh)
KeyTable /etc/opendkim/KeyTable
# "refile:" habilita o "*" como curinga na SigningTable — sem o prefixo,
# a linha "*@matchimoveis.online ..." é lida como texto literal e nunca
# bate com nenhum remetente real (mensagem sempre sai sem assinar).
SigningTable refile:/etc/opendkim/SigningTable
ExternalIgnoreList /etc/opendkim/TrustedHosts
InternalHosts /etc/opendkim/TrustedHosts

# Socket Unix compartilhado com o Postfix (milter) — mais rápido e seguro
# que TCP local, e é o que o main.cf do Postfix espera em smtpd_milters
Socket local:/var/run/opendkim/opendkim.sock
PidFile /var/run/opendkim/opendkim.pid

# Sem isso o socket nasce sem permissão de ESCRITA pro grupo (só leitura),
# e o Postfix (mesmo estando no grupo opendkim) não consegue conectar nele
# — dá "Permission denied" no log mesmo com todo o resto certo.
UMask 007

# Roda como usuário próprio, sem privilégio de root (setup_email_infra.sh
# já cria o usuário/grupo opendkim e ajusta permissão da chave privada)
UserID opendkim:opendkim

# Algoritmo e canonicalização — relaxed/relaxed é o padrão recomendado hoje
# (tolera pequenas alterações no cabeçalho/corpo feitas por servidores no
# meio do caminho sem invalidar a assinatura à toa)
Canonicalization relaxed/relaxed
SignatureAlgorithm rsa-sha256

# Cabeçalhos que entram na assinatura — os essenciais pra provar
# autenticidade sem assinar cabeçalho que pode mudar legitimamente em trânsito
OversignHeaders From

# Log
Syslog yes
SyslogSuccess yes
LogWhy yes
